  <g fill="var(--ink)" opacity=".2"><rect x="150" y="1960" width="820" height="8" rx="4"/><rect x="150" y="2000" width="530" height="8" rx="4"/><rect x="2870" y="150" width="820" height="8" rx="4"/><rect x="3160" y="190" width="530" height="8" rx="4"/></g>
</svg>
