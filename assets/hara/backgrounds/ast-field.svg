    <g fill="var(--ground)" stroke="#35A8FF" stroke-width="7"><circle cx="1340" cy="720" r="36"/><circle cx="2500" cy="700" r="36"/></g>
    <g fill="#35A8FF"><circle cx="1340" cy="720" r="16"/><circle cx="2500" cy="700" r="16"/></g>
    <g fill="var(--ground)" stroke="#7B70FF" stroke-width="7"><circle cx="890" cy="430" r="30"/><circle cx="1540" cy="390" r="30"/><circle cx="2250" cy="390" r="30"/><circle cx="3000" cy="420" r="30"/><circle cx="1050" cy="1350" r="34"/><circle cx="1600" cy="1460" r="34"/><circle cx="2280" cy="1450" r="34"/><circle cx="2850" cy="1320" r="34"/></g>
