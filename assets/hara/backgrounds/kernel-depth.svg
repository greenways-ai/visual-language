<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Hara kernel depth</title>
  <desc id="desc">A perspective stack of executable frames and code traces converging on the Hara evaluation knot, suggesting a compact language kernel.</desc>
  <defs>
    <linearGradient id="spectrum" x1="480" y1="240" x2="3360" y2="1920" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#36F1DE"/><stop offset=".48" stop-color="#35A8FF"/><stop offset="1" stop-color="#A23CFF"/></linearGradient>
    <linearGradient id="spectrumLocal" x1="110" y1="90" x2="540" y2="870" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#36F1DE"/><stop offset=".48" stop-color="#35A8FF"/><stop offset="1" stop-color="#A23CFF"/></linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0H0V96" fill="none" stroke="var(--grid)" stroke-width="2" opacity=".22"/><circle cx="0" cy="0" r="4" fill="var(--grid)" opacity=".28"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="frameStroke" x1="500" y1="200" x2="3340" y2="1960" gradientUnits="userSpaceOnUse"><stop stop-color="#36F1DE"/><stop offset=".52" stop-color="#35A8FF"/><stop offset="1" stop-color="#A23CFF"/></linearGradient>
    <radialGradient id="portal" cx=".5" cy=".5" r=".5"><stop stop-color="#36F1DE" stop-opacity=".28"/><stop offset=".42" stop-color="#35A8FF" stop-opacity=".12"/><stop offset="1" stop-color="#A23CFF" stop-opacity="0"/></radialGradient>
    <style>:root{--ground:#eef8f7;--surface:#dbeceb;--ink:#092632;--grid:#0f6d78;--line:#146f88;--quiet:#3b6470}@media(prefers-color-scheme:dark){:root{--ground:#05070e;--surface:#0a1220;--ink:#e8fffc;--grid:#36F1DE;--line:#35A8FF;--quiet:#8aa5b8}}</style>
  </defs>
  <rect width="3840" height="2160" fill="var(--ground)"/>
  <rect width="3840" height="2160" fill="url(#grid)" opacity=".62"/>
  <ellipse cx="1920" cy="1080" rx="1100" ry="750" fill="url(#portal)"/>
  <g><rect x="180" y="120" width="3480" height="1920" rx="120" fill="none" stroke="url(#frameStroke)" stroke-width="5" opacity=".18"/><rect x="350" y="220" width="3140" height="1720" rx="113" fill="none" stroke="url(#frameStroke)" stroke-width="6" opacity=".24"/><rect x="520" y="320" width="2800" height="1520" rx="106" fill="none" stroke="url(#frameStroke)" stroke-width="7" opacity=".30"/><rect x="690" y="420" width="2460" height="1320" rx="99" fill="none" stroke="url(#frameStroke)" stroke-width="8" opacity=".36"/><rect x="860" y="520" width="2120" height="1120" rx="92" fill="none" stroke="url(#frameStroke)" stroke-width="9" opacity=".42"/><rect x="1030" y="620" width="1780" height="920" rx="85" fill="none" stroke="url(#frameStroke)" stroke-width="10" opacity=".48"/><rect x="1200" y="720" width="1440" height="720" rx="78" fill="none" stroke="url(#frameStroke)" stroke-width="11" opacity=".54"/><rect x="1370" y="820" width="1100" height="520" rx="71" fill="none" stroke="url(#frameStroke)" stroke-width="12" opacity=".60"/><rect x="1540" y="920" width="760" height="320" rx="64" fill="none" stroke="url(#frameStroke)" stroke-width="13" opacity=".66"/></g>
  <g fill="none" stroke="url(#frameStroke)" stroke-width="5" opacity=".36"><path d="M180 120 1540 760"/><path d="M3660 120 2300 760"/><path d="M180 2040 1540 1400"/><path d="M3660 2040 2300 1400"/><path d="M730 120 1710 760"/><path d="M3110 120 2130 760"/><path d="M730 2040 1710 1400"/><path d="M3110 2040 2130 1400"/></g>
  <g fill="var(--ink)" opacity=".2"><rect x="280" y="400" width="450" height="18" rx="9"/><rect x="3110" y="460" width="450" height="18" rx="9"/><rect x="280" y="570" width="570" height="18" rx="9"/><rect x="2990" y="630" width="570" height="18" rx="9"/><rect x="280" y="740" width="690" height="18" rx="9"/><rect x="2870" y="800" width="690" height="18" rx="9"/><rect x="280" y="910" width="450" height="18" rx="9"/><rect x="3110" y="970" width="450" height="18" rx="9"/><rect x="280" y="1080" width="570" height="18" rx="9"/><rect x="2990" y="1140" width="570" height="18" rx="9"/><rect x="280" y="1250" width="690" height="18" rx="9"/><rect x="2870" y="1310" width="690" height="18" rx="9"/><rect x="280" y="1420" width="450" height="18" rx="9"/><rect x="3110" y="1480" width="450" height="18" rx="9"/><rect x="280" y="1590" width="570" height="18" rx="9"/><rect x="2990" y="1650" width="570" height="18" rx="9"/></g>
  <g transform="translate(1600 600)" opacity=".96" filter="url(#softGlow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path stroke="var(--ground)" stroke-width="78" d="M320 84C140 84 92 238 207 357c87 90 98 151 0 246C92 722 140 876 320 876"/><path stroke="url(#spectrumLocal)" stroke-width="48" d="M320 84C140 84 92 238 207 357c87 90 98 151 0 246C92 722 140 876 320 876"/>
    <path stroke="var(--ground)" stroke-width="78" d="M320 84c180 0 228 154 113 273-87 90-98 151 0 246 115 119 67 273-113 273"/><path stroke="url(#spectrumLocal)" stroke-width="48" d="M320 84c180 0 228 154 113 273-87 90-98 151 0 246 115 119 67 273-113 273"/>
    <path stroke="var(--ground)" stroke-width="78" d="M151 302c86-92 252-92 338 0"/><path stroke="url(#spectrumLocal)" stroke-width="48" d="M151 302c86-92 252-92 338 0"/>
    <path stroke="var(--ground)" stroke-width="78" d="M151 658c86 92 252 92 338 0"/><path stroke="url(#spectrumLocal)" stroke-width="48" d="M151 658c86 92 252 92 338 0"/>
    <path stroke="var(--ground)" stroke-width="78" d="M320 188v584"/><path stroke="url(#spectrumLocal)" stroke-width="48" d="M320 188v584"/><circle cx="320" cy="480" r="23" fill="var(--ground)" stroke="url(#spectrumLocal)" stroke-width="12"/>
  </g>
  <g fill="none" stroke="url(#spectrum)" opacity=".48"><path d="M1540 760h760v640h-760Z" stroke-width="8"/><path d="M1660 850h520M1660 930h350M1660 1010h440M1660 1090h260M1660 1170h470M1660 1250h320" stroke-width="5" stroke-linecap="round"/></g>
  <circle cx="1920" cy="1080" r="520" fill="none" stroke="var(--ink)" stroke-width="3" opacity=".12"/>
</svg>
