<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3840 2160" preserveAspectRatio="xMidYMid slice" role="img" aria-labelledby="title desc">
  <title id="title">Hara dataflow orbit</title>
  <desc id="desc">Concentric dataflow orbits, directional traces, and evaluation nodes rotate around the Hara interlocking knot.</desc>
  <defs>
    <linearGradient id="spectrum" x1="480" y1="240" x2="3360" y2="1920" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#36F1DE"/><stop offset=".48" stop-color="#35A8FF"/><stop offset="1" stop-color="#A23CFF"/></linearGradient>
    <linearGradient id="spectrumLocal" x1="110" y1="90" x2="540" y2="870" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#36F1DE"/><stop offset=".48" stop-color="#35A8FF"/><stop offset="1" stop-color="#A23CFF"/></linearGradient>
    <pattern id="grid" width="96" height="96" patternUnits="userSpaceOnUse"><path d="M96 0H0V96" fill="none" stroke="var(--grid)" stroke-width="2" opacity=".22"/><circle cx="0" cy="0" r="4" fill="var(--grid)" opacity=".28"/></pattern>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="18" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop stop-color="#36F1DE" stop-opacity=".32"/><stop offset=".45" stop-color="#35A8FF" stop-opacity=".12"/><stop offset="1" stop-color="#A23CFF" stop-opacity="0"/></radialGradient>
    <marker id="arrow" viewBox="0 0 14 14" refX="12" refY="7" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M1 1l12 6-12 6Z" fill="#35A8FF"/></marker>
    <style>:root{--ground:#eef8f7;--surface:#dbeceb;--ink:#092632;--grid:#0f6d78;--line:#146f88;--quiet:#3b6470}@media(prefers-color-scheme:dark){:root{--ground:#05070e;--surface:#0a1220;--ink:#e8fffc;--grid:#36F1DE;--line:#35A8FF;--quiet:#8aa5b8}}</style>
  </defs>
  <rect width="3840" height="2160" fill="var(--ground)"/>
  <rect width="3840" height="2160" fill="url(#grid)" opacity=".76"/>
  <ellipse cx="1920" cy="1080" rx="1420" ry="880" fill="url(#core)"/>
