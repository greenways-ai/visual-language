<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Greenways OS Chrome toolbar launcher." />
    <meta name="theme-color" content="#090b0e" />
    <title>Greenways</title>
    <link rel="stylesheet" href="./assets/greenways-os-v2.css" />
  </head>
  <body class="extension-page popup-page">
    <header class="extension-header">
      <a class="gw-wordmark" href="./index.html" aria-label="Greenways OS v2">
        <span class="gw-mark" aria-hidden="true"></span>
        <span class="gw-wordmark__copy"><strong>Greenways</strong><small>browser companion</small></span>
      </a>
      <div class="extension-header__actions">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Switch colour theme"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="3.2"></circle><path d="M10 2v2M10 16v2M2 10h2M16 10h2M4.35 4.35l1.4 1.4M14.25 14.25l1.4 1.4M4.35 15.65l1.4-1.4M14.25 5.75l1.4-1.4"></path></svg></button>
        <button class="icon-btn" type="button" data-popup-action="open-options" aria-label="Open extension settings">••</button>
      </div>
    </header>

    <main class="popup-content">
      <section class="connection-card">
        <div class="connection-card__top"><span class="status-pill status-pill--good"><span class="status-light status-light--good"></span>Connected</span><small data-popup-workspace>Workspace 01</small></div>
        <h1 data-popup-page-title>Current page ready.</h1>
        <p data-popup-page-url>Open the side panel to capture, inspect or hand this page to a workroom.</p>
        <div class="popup-metrics">
          <div class="popup-metric"><strong data-popup-approval-count>3</strong><small>approvals</small></div>
          <div class="popup-metric"><strong data-popup-agent-count>1</strong><small>agent active</small></div>
          <div class="popup-metric"><strong data-popup-receipt-count>3</strong><small>receipts</small></div>
        </div>
      </section>

      <div class="quick-actions" aria-label="Greenways quick actions">
        <button class="quick-action" type="button" data-popup-action="open-sidepanel"><span class="quick-action__icon">SP</span><strong>Open side panel</strong></button>
        <button class="quick-action" type="button" data-popup-action="open-desktop"><span class="quick-action__icon">DT</span><strong>Open desktop</strong></button>
        <button class="quick-action" type="button" data-popup-action="save-page"><span class="quick-action__icon">SV</span><strong>Save this page</strong></button>
        <button class="quick-action" type="button" data-popup-action="open-studio"><span class="quick-action__icon">ST</span><strong>Open in Studio</strong></button>
      </div>

      <section class="popup-section">
        <header class="popup-section__head"><strong>Next approval</strong><button class="text-button" type="button" data-popup-action="review-approval">Review all</button></header>
        <button class="popup-approval" type="button" data-popup-action="review-approval">
          <span class="status-light status-light--warn" aria-hidden="true"></span>
          <span><strong data-popup-approval-operation>keyring/sign</strong><small data-popup-approval-scope>release/atlas-of-quiet-machines@0.8.0</small></span>
          <span>→</span>
        </button>
      </section>
    </main>

    <footer class="popup-footer"><span><span class="status-light status-light--good"></span> Browser + Hestia</span><span>⌘⇧G desktop</span></footer>
    <div data-toast-region class="toast-region" aria-live="polite"></div>
    <script type="module" src="./assets/popup.js"></script>
  </body>
</html>
