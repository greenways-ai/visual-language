name: Refresh Greenways master mark

on:
  push:
    branches:
      - brand/greenways-master-mark

permissions:
  contents: write

concurrency:
  group: refresh-greenways-master-mark
  cancel-in-progress: true

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: brand/greenways-master-mark
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - name: Generate canonical assets
        run: npm run assets
      - name: Commit generated Greenways mark
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/favicons/greenways*.svg
          if git diff --cached --quiet; then
            echo "Greenways mark assets are already current."
            exit 0
          fi
          git commit -m "chore: regenerate Greenways master mark [skip ci]"
          git push origin HEAD:brand/greenways-master-mark
