name: Private project-flower bootstrap bridge

on:
  push:
    branches: [agent/project-flower-source-bootstrap-16]
    paths:
      - .github/workflows/bootstrap-assets-private-bridge.yml

permissions:
  contents: write

concurrency:
  group: private-project-flower-bootstrap-bridge
  cancel-in-progress: true

jobs:
  transfer:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Checkout the reviewed Greenways asset registry
        uses: actions/checkout@v4
        with:
          repository: greenways-ai/greenways-os
          ref: 1dfb41a2edf4c44a6fd87bf6a4165acfc070f344
          path: .bootstrap/greenways-os
          sparse-checkout: services/assets
          sparse-checkout-cone-mode: false
      - name: Install repository-local LFS filters
        run: git lfs install --local
      - name: Create and publish an ephemeral transfer certificate
        run: |
          openssl req -x509 -newkey rsa:3072 -sha256 -days 1 -nodes \
            -subj "/CN=greenways-project-flower-bootstrap-${GITHUB_RUN_ID}" \
            -keyout "$RUNNER_TEMP/bridge-private.pem" \
            -out "$RUNNER_TEMP/bridge-certificate.pem" >/dev/null 2>&1
          export GREENWAYS_BRIDGE_CERTIFICATE="$(base64 -w0 "$RUNNER_TEMP/bridge-certificate.pem")"
          node --input-type=module <<'NODE'
          import { writeFile } from "node:fs/promises";

          const certificate = {
            protocol: "greenways-private-bootstrap-certificate/0-alpha",
            runId: process.env.GITHUB_RUN_ID,
            cipher: "openssl-cms-aes256/1",
            certificateBase64: process.env.GREENWAYS_BRIDGE_CERTIFICATE,
          };
          await writeFile(
            "catalogue/bootstrap-private-certificate.json",
            `${JSON.stringify(certificate, null, 2)}\n`,
            "utf8",
          );
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalogue/bootstrap-private-certificate.json
          git commit -m "Publish an ephemeral bootstrap certificate"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Await and assemble the encrypted transfer
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from "node:crypto";
          import { writeFile } from "node:fs/promises";
          import { join } from "node:path";

          const repository = process.env.GITHUB_REPOSITORY;
          const branch = process.env.GITHUB_REF_NAME;
          const runId = process.env.GITHUB_RUN_ID;
          const token = process.env.GITHUB_TOKEN;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${token}`,
            "X-GitHub-Api-Version": "2022-11-28",
          };
          const digest = (bytes) => createHash("sha256").update(bytes).digest("hex");
          const sleep = (milliseconds) => new Promise((resolve) => setTimeout(resolve, milliseconds));

          async function request(path) {
            const response = await fetch(`https://api.github.com/repos/${repository}${path}`, { headers });
            if (!response.ok) {
              const error = new Error(`GitHub API ${path} returned ${response.status}`);
              error.status = response.status;
              throw error;
            }
            return response.json();
          }

          let manifest = null;
          for (let attempt = 0; attempt < 200; attempt += 1) {
            try {
              const file = await request(
                `/contents/catalogue/bootstrap-private-transfer.json?ref=${encodeURIComponent(branch)}`,
              );
              const source = Buffer.from(file.content.replace(/\s/g, ""), "base64").toString("utf8");
              const candidate = JSON.parse(source);
              if (
                candidate.protocol === "greenways-private-bootstrap-transfer/0-alpha" &&
                String(candidate.runId) === runId
              ) {
                manifest = candidate;
                break;
              }
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await sleep(3000);
          }

          if (!manifest) throw new Error(`Timed out waiting for encrypted transfer manifest for run ${runId}`);
          if (manifest.cipher !== "openssl-cms-aes256/1") throw new Error("Unexpected private-transfer cipher");
          if (!Number.isSafeInteger(manifest.bytes) || manifest.bytes <= 0) throw new Error("Invalid ciphertext byte length");
          if (!/^[0-9a-f]{64}$/.test(manifest.sha256)) throw new Error("Invalid ciphertext digest");
          if (!Array.isArray(manifest.chunks) || manifest.chunks.length < 1 || manifest.chunks.length > 64) {
            throw new Error("Invalid encrypted chunk list");
          }

          const chunks = [];
          for (const [position, chunk] of manifest.chunks.entries()) {
            if (chunk.index !== position) throw new Error(`Encrypted chunk ${position} is out of order`);
            if (!/^[0-9a-f]{40,64}$/.test(chunk.blobSha)) throw new Error(`Encrypted chunk ${position} has an invalid blob SHA`);
            if (!Number.isSafeInteger(chunk.bytes) || chunk.bytes <= 0) throw new Error(`Encrypted chunk ${position} has an invalid length`);
            if (!/^[0-9a-f]{64}$/.test(chunk.sha256)) throw new Error(`Encrypted chunk ${position} has an invalid digest`);
            const blob = await request(`/git/blobs/${chunk.blobSha}`);
            if (blob.encoding !== "base64") throw new Error(`Encrypted chunk ${position} has an unexpected encoding`);
            const bytes = Buffer.from(blob.content.replace(/\s/g, ""), "base64");
            if (bytes.byteLength !== chunk.bytes) throw new Error(`Encrypted chunk ${position} byte length changed`);
            if (digest(bytes) !== chunk.sha256) throw new Error(`Encrypted chunk ${position} digest changed`);
            chunks.push(bytes);
          }

          const ciphertext = Buffer.concat(chunks);
          if (ciphertext.byteLength !== manifest.bytes) throw new Error("Encrypted transfer byte length changed");
          if (digest(ciphertext) !== manifest.sha256) throw new Error("Encrypted transfer digest changed");
          await writeFile(join(process.env.RUNNER_TEMP, "project-flowers.cms"), ciphertext);
          console.log(`Assembled ${chunks.length} encrypted capability blobs for run ${runId}.`);
          NODE
      - name: Fast-forward to the transfer manifest
        run: git pull --ff-only origin "$GITHUB_REF_NAME"
      - name: Decrypt and verify the reviewed archive
        run: |
          openssl cms -decrypt -binary -inform DER \
            -in "$RUNNER_TEMP/project-flowers.cms" \
            -recip "$RUNNER_TEMP/bridge-certificate.pem" \
            -inkey "$RUNNER_TEMP/bridge-private.pem" \
            -out "$RUNNER_TEMP/greenways-project-flower-lfs-seed.zip"
          npm run stage:catalogue-bundle -- "$RUNNER_TEMP/greenways-project-flower-lfs-seed.zip"
      - name: Generate and verify the exact catalogue
        run: |
          node scripts/bootstrap-asset-catalogue.mjs
          printf 'catalogue/objects/** filter=lfs diff=lfs merge=lfs -text\n' > .gitattributes
          GREENWAYS_ASSETS_REQUIRE_HYDRATED=1 node scripts/verify-asset-catalogue.mjs
      - name: Commit only permanent LFS objects and reviewed metadata
        run: |
          rm -rf .bootstrap
          rm -f catalogue/bootstrap-private-certificate.json
          rm -f catalogue/bootstrap-private-transfer.json
          rm -f .github/workflows/bootstrap-assets-private-bridge.yml
          git add -A
          git diff --cached --check
          test "$(git lfs ls-files --name-only | wc -l | tr -d ' ')" = "8"
          git lfs status
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Seed the project-flower asset catalogue"
          git lfs push origin HEAD
          git push origin "HEAD:${GITHUB_REF_NAME}"
