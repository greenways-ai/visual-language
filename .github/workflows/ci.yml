name: Visual language

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GREENWAYS_ASSETS_REQUIRE_HYDRATED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Require a completed project-flower source bootstrap
        if: ${{ github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/project-flower-source-bootstrap-') }}
        env:
          GREENWAYS_ASSET_BOOTSTRAP_BRANCH: ${{ github.head_ref }}
        run: node scripts/verify-asset-catalogue-bootstrap-merge.mjs
