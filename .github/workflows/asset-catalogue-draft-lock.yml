name: Asset catalogue source-bootstrap draft lock

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

jobs:
  keep-incomplete-source-bootstrap-draft:
    if: startsWith(github.event.pull_request.head.ref, 'agent/project-flower-source-bootstrap-')
    runs-on: ubuntu-latest
    steps:
      - name: Inspect bootstrap status without executing pull-request code
        uses: actions/github-script@v7
        with:
          script: |
            const pullRequest = context.payload.pull_request;
            const response = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "catalogue/bootstrap-status.json",
              ref: pullRequest.head.sha,
            });

            if (Array.isArray(response.data) || response.data.type !== "file") {
              throw new Error("Source-bootstrap pull request does not contain catalogue/bootstrap-status.json");
            }

            const source = Buffer.from(response.data.content, "base64").toString("utf8");
            const status = JSON.parse(source);
            const complete =
              status.protocol === "greenways-asset-catalogue-bootstrap/0-alpha" &&
              status.state === "complete" &&
              status.sourceCount === 8 &&
              status.selectedCount === 7 &&
              status.publishedCount === 1 &&
              status.release === "greenways.project-flowers/v1";

            if (complete) {
              core.notice("The project-flower source bootstrap is complete; the pull request may leave draft state.");
              return;
            }

            core.notice(
              `Keeping source-bootstrap pull request #${pullRequest.number} in draft: state=${JSON.stringify(status.state)}.`,
            );

            if (!pullRequest.draft) {
              await github.graphql(
                `mutation($pullRequestId: ID!) {
                  convertPullRequestToDraft(input: {pullRequestId: $pullRequestId}) {
                    pullRequest { isDraft }
                  }
                }`,
                { pullRequestId: pullRequest.node_id },
              );
            }
